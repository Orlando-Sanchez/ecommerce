services:
  db:
    image: postgres:17
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - ".env"
  web:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    restart: always
    volumes:
      - .:/ecommerce
    env_file:
      - ".env"
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  db_data: